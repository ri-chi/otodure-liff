<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 16px; background: #faf8f5; }
    #clock { touch-action: none; user-select: none; }
    .swatches { display: flex; justify-content: center; gap: 14px; margin: 14px 0 6px; }
    .swatch { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; padding: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.12); }
    .swatch.selected { border-color: #fff; box-shadow: 0 0 0 3px #333; }
    #timeLabel { font-size: 18px; margin: 12px 0; }
    #formDetail { width: 100%; box-sizing: border-box; padding: 10px; font-size: 14px; margin: 8px 0; }
    #closeBtn { background: none; color: #888; border: none; padding: 10px; font-size: 14px; margin-top: 20px; text-decoration: underline; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
    #timeAdjustBtn { background: none; border: 1px solid #888; color: #555; border-radius: 20px; padding: 8px 18px; font-size: 13px; margin-top: 10px; }
    #timeAdjustBtn.active, #calendarBtn.active { border-color: #06c755; color: #06c755; background: #eafaf0; }

    #recordForm, #recordDetail { border-top: 1px solid #ddd; margin-top: 16px; padding-top: 16px; text-align: left; max-width: 280px; margin-left: auto; margin-right: auto; }
    #recordFormTitle { text-align: center; font-weight: bold; margin-bottom: 10px; }
    .time-block { background: white; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; padding: 8px 0 4px; }
    .time-block-label { text-align: center; font-size: 13px; color: #666; }
    .form-btn { padding: 12px 20px; border-radius: 20px; border: none; font-size: 14px; margin: 6px 4px; }
    #formConfirmBtn { background: #06c755; color: white; }
    #formConfirmBtn:disabled { background: #ccc; }
    #formCancelBtn { background: #ccc; color: #333; }
    #formDeleteBtn { display: block; margin: 10px auto 0; background: none; border: none; color: #e74c3c; font-size: 14px; text-decoration: underline; padding: 8px; }

    .wheel-wrap { position: relative; display: flex; justify-content: center; align-items: center; gap: 4px; height: 108px; }
    .wheel-highlight { position: absolute; top: 36px; left: 20px; right: 20px; height: 36px; background: #f2f2f2; border-radius: 18px; z-index: 0; }
    .wheel { position: relative; z-index: 1; height: 108px; width: 70px; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; background: transparent; }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel-item { height: 36px; line-height: 36px; text-align: center; font-size: 19px; scroll-snap-align: center; color: #bbb; }
    .wheel-item.center { color: #222; font-weight: bold; }
    .wheel-colon { position: relative; z-index: 1; font-size: 20px; font-weight: bold; }

    #calendarBtn { background: none; border: 1px solid #888; color: #555; border-radius: 20px; padding: 8px 18px; font-size: 13px; margin-top: 10px; margin-left: 6px; }

    #calendarArea { border-top: 1px solid #ddd; margin-top: 16px; padding-top: 16px; max-width: 280px; margin-left: auto; margin-right: auto; }
    #calHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #calHeader button { background: none; border: none; font-size: 20px; color: #06c755; padding: 4px 12px; }
    #calMonthLabel { font-weight: bold; font-size: 15px; }
    #calWeekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: #888; margin-bottom: 4px; }
    #calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day { text-align: center; padding: 8px 0; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .cal-day.empty { visibility: hidden; }
    .cal-day.disabled { color: #ccc; cursor: default; }
    .cal-day.today { border: 1px solid #06c755; }
    .cal-day.selected { background: #06c755; color: white; }
    #calendarArea #calTodayBtn, #calendarArea #calCloseBtn { padding: 10px 18px; border-radius: 20px; border: none; font-size: 13px; margin: 6px 4px; background: #ccc; color: #333; }

    #roomTabBtn { background: none; border: 1px solid #888; color: #555; border-radius: 20px; padding: 8px 18px; font-size: 13px; margin-top: 10px; margin-left: 6px; }
    #roomView { border-top: 1px solid #ddd; margin-top: 16px; padding-top: 16px; max-width: 280px; margin-left: auto; margin-right: auto; text-align: left; }
    #roomView h4 { text-align: center; margin: 0 0 12px; font-size: 14px; color: #555; }
    .room-member-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: white; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .room-member-row.me { border-color: #06c755; background: #eafaf0; }
    .room-member-name { color: #333; }
    .room-member-title { font-weight: bold; color: #06c755; text-align: right; }
    #roomViewCloseBtn { display: block; margin: 12px auto 0; padding: 10px 18px; border-radius: 20px; border: none; font-size: 13px; background: #ccc; color: #333; }

    #clockWrap { position: relative; width: 300px; margin: 0 auto; }
    #clockWrap.loading { visibility: hidden; }


    #summaryArea { border-top: 1px solid #ddd; margin-top: 24px; padding-top: 16px; padding-bottom: 8px; max-width: 280px; margin-left: auto; margin-right: auto; text-align: left; }
    #summaryArea h4 { text-align: center; margin: 0 0 12px; font-size: 14px; color: #555; }
    .day-row { display: flex; align-items: center; padding: 10px 12px; background: white; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; font-size: 13px; cursor: pointer; }
    .day-row .dot { flex-shrink: 0; margin-right: 0; }
    .day-row .day-time { font-weight: bold; margin: 0 10px 0 8px; white-space: nowrap; color: #222; }
    .day-row .day-text { flex: 1; min-width: 0; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .day-empty { text-align: center; color: #999; font-size: 13px; padding: 8px 0; }
    #dayTotal { text-align: center; font-size: 13px; color: #555; margin-top: 4px; }

    .detail-card { background: white; border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .detail-time { display: flex; align-items: center; font-size: 16px; font-weight: bold; }
    .detail-time .dot { width: 14px; height: 14px; margin-right: 8px; }
    #detailDuration { font-size: 13px; font-weight: normal; color: #888; margin-left: 8px; }
    #detailText { margin-top: 10px; font-size: 15px; color: #222; white-space: pre-wrap; word-break: break-word; }
    #detailText.empty { color: #aaa; font-size: 13px; }
    #detailCloseBtn { background: #ccc; color: #333; }
    #detailEditBtn { background: #06c755; color: white; }

    #initialLoading { padding: 60px 16px; color: #888; font-size: 15px; }

    #modeGate, #roomSetupArea { max-width: 300px; margin: 40px auto; text-align: center; }
    #modeGate h3, #roomSetupArea h3 { font-size: 17px; margin-bottom: 24px; }
    .mode-choice-btn { display: block; width: 100%; padding: 18px; margin: 12px 0; border-radius: 12px; border: 2px solid #ddd; background: white; font-size: 15px; text-align: left; box-sizing: border-box; }
    .mode-choice-btn .mode-title { font-weight: bold; font-size: 16px; display: block; margin-bottom: 4px; }
    .mode-choice-btn .mode-desc { color: #888; font-size: 12px; display: block; }
    .mode-choice-btn:active { border-color: #06c755; background: #eafaf0; }
    #roomSetupArea input { width: 90%; padding: 10px; font-size: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    #roomSetupArea button { padding: 12px 24px; border-radius: 20px; border: none; font-size: 14px; margin: 10px 4px; }
    #roomJoinBtn { background: #06c755; color: white; }
    #roomBackBtn { background: #ccc; color: #333; }
    #roomSetupError { color: #e74c3c; font-size: 12px; min-height: 16px; margin-top: 4px; }
    #changeModeBtn { background: none; color: #888; border: none; padding: 10px; font-size: 12px; margin-top: 10px; text-decoration: underline; display: block; margin-left: auto; margin-right: auto; }

    #centerAlert { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: #fff3f2; border: 2px solid #e74c3c; color: #c0392b; padding: 18px 22px; border-radius: 14px; font-size: 14px; font-weight: bold; text-align: center; max-width: 82vw; box-shadow: 0 6px 24px rgba(0,0,0,0.25); line-height: 1.5; white-space: pre-line; }
    #centerAlert.show { display: block; }
  </style>
</head>
<body>
  <script>
  window.onerror = function(message, source, lineno, colno, error) {
      var el = document.getElementById('timeLabel');
      if (el) el.textContent = 'JSエラー: ' + message + ' (行:' + lineno + ')';
    };
  </script>

  <div id="centerAlert"></div>

  <div id="initialLoading">読み込み中...</div>

  <div id="modeGate" style="display:none;">
    <h3>使い方を選んでください</h3>
    <div class="mode-choice-btn" id="soloModeBtn">
      <span class="mode-title">時計簿として使う</span>
      <span class="mode-desc">自分だけで記録・振り返りをする一人モード</span>
    </div>
    <div class="mode-choice-btn" id="roomModeBtn">
      <span class="mode-title">合言葉で部屋に入る</span>
      <span class="mode-desc">同じ合言葉を入力した友だちと部屋を作る(ランキング機能など)</span>
    </div>
  </div>

  <div id="roomSetupArea" style="display:none;">
    <h3>部屋に入る</h3>
    <input type="text" id="roomCodeInput" placeholder="合言葉" maxlength="30">
    <input type="text" id="nicknameInput" placeholder="ニックネーム" maxlength="20">
    <div id="roomSetupError"></div>
    <div>
      <button id="roomJoinBtn">この部屋に入る</button>
      <button id="roomBackBtn">戻る</button>
    </div>
  </div>

  <div id="mainApp" style="display:none;">
  <h3 id="dateHeading">記録</h3>
  <div id="timeLabel">記録をタップすると内容を見られます。新しい記録は「時刻で調整」からどうぞ</div>

  <div id="clockWrap" class="loading">
    <svg id="clock" width="300" height="352" viewBox="0 0 300 352">
      <defs>
        <mask id="moonMask">
          <rect x="0" y="300" width="300" height="52" fill="white"/>
          <circle cx="158" cy="327" r="10" fill="black"/>
        </mask>
      </defs>
      <g id="track"></g>
      <g id="savedArcs"></g>
      <g id="ticks"></g>
      <text x="150" y="176" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#aaa" pointer-events="none">24時間</text>
      <!-- 昼の12時(上)に太陽 -->
      <g id="sunIcon" pointer-events="none">
        <circle cx="150" cy="22" r="7" fill="#ffb703"/>
        <g stroke="#ffb703" stroke-width="2" stroke-linecap="round">
          <line x1="150" y1="9" x2="150" y2="5"/><line x1="150" y1="35" x2="150" y2="39"/>
          <line x1="137" y1="22" x2="133" y2="22"/><line x1="163" y1="22" x2="167" y2="22"/>
          <line x1="141" y1="13" x2="138" y2="10"/><line x1="159" y1="13" x2="162" y2="10"/>
          <line x1="141" y1="31" x2="138" y2="34"/><line x1="159" y1="31" x2="162" y2="34"/>
        </g>
      </g>
      <!-- 夜の12時(下)に月 -->
      <circle id="moonIcon" cx="150" cy="330" r="11" fill="#6b78b0" mask="url(#moonMask)" pointer-events="none"/>
    </svg>
  </div>

  <button id="timeAdjustBtn">時刻で調整</button>
  <button id="calendarBtn">📅 日付を選ぶ</button>
  <button id="roomTabBtn" style="display:none;">🏠 部屋</button>

  <div id="calendarArea" style="display:none;">
    <div id="calHeader">
      <button id="calPrevBtn">‹</button>
      <span id="calMonthLabel"></span>
      <button id="calNextBtn">›</button>
    </div>
    <div id="calWeekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div id="calGrid"></div>
    <div style="text-align:center;">
      <button id="calTodayBtn">今日に戻る</button>
      <button id="calCloseBtn">閉じる</button>
    </div>
  </div>

  <div id="roomView" style="display:none;">
    <h4 id="roomViewTitle">部屋</h4>
    <div id="roomMemberList"></div>
    <button id="roomViewCloseBtn">閉じる</button>
  </div>

  <div id="recordDetail" style="display:none;">
    <div style="text-align:center;font-weight:bold;margin-bottom:10px;">記録の概要</div>
    <div class="detail-card">
      <div class="detail-time"><span class="dot" id="detailDot"></span><span id="detailTime"></span><span id="detailDuration"></span></div>
      <div id="detailText"></div>
    </div>
    <div style="text-align:center;">
      <button class="form-btn" id="detailCloseBtn">閉じる</button>
      <button class="form-btn" id="detailEditBtn">編集</button>
    </div>
  </div>

  <div id="recordForm" style="display:none;">
    <div id="recordFormTitle">時刻で調整</div>
    <div class="time-block">
      <div class="time-block-label">開始</div>
      <div class="wheel-wrap">
        <div class="wheel-highlight"></div>
        <div class="wheel" id="startHourWheel"></div>
        <div class="wheel-colon">:</div>
        <div class="wheel" id="startMinuteWheel"></div>
      </div>
    </div>
    <div class="time-block">
      <div class="time-block-label">終了</div>
      <div class="wheel-wrap">
        <div class="wheel-highlight"></div>
        <div class="wheel" id="endHourWheel"></div>
        <div class="wheel-colon">:</div>
        <div class="wheel" id="endMinuteWheel"></div>
      </div>
    </div>
    <div class="swatches">
      <button type="button" class="swatch" data-color="red" aria-label="赤" style="background:#e74c3c;"></button>
      <button type="button" class="swatch" data-color="blue" aria-label="青" style="background:#219ebc;"></button>
      <button type="button" class="swatch" data-color="green" aria-label="緑" style="background:#6cc24a;"></button>
      <button type="button" class="swatch" data-color="orange" aria-label="オレンジ" style="background:#ffb703;"></button>
      <button type="button" class="swatch" data-color="pink" aria-label="ピンク" style="background:#ff7eb6;"></button>
    </div>
    <input type="text" id="formDetail" placeholder="内容(例: 散歩、読書)">
    <br>
    <div style="text-align:center;">
      <button class="form-btn" id="formCancelBtn">キャンセル</button>
      <button class="form-btn" id="formConfirmBtn" disabled>決定</button>
    </div>
    <button id="formDeleteBtn" style="display:none;">この記録を削除</button>
  </div>

  <button id="closeBtn">記録を終えて閉じる</button>

  <div id="summaryArea">
    <h4>この日の記録</h4>
    <div id="dayList"></div>
    <div id="dayTotal"></div>
  </div>

  <button id="changeModeBtn">使い方の設定を変更</button>
  </div>

  <iframe name="hiddenFrame" style="display:none;"></iframe>
  <form id="saveForm" method="POST" target="hiddenFrame" style="display:none;">
    <input type="hidden" name="action" id="f_action">
    <input type="hidden" name="id" id="f_id">
    <input type="hidden" name="userId" id="f_userId">
    <input type="hidden" name="category" id="f_category">
    <input type="hidden" name="startHour" id="f_startHour">
    <input type="hidden" name="endHour" id="f_endHour">
    <input type="hidden" name="detail" id="f_detail">
    <input type="hidden" name="date" id="f_date">
    <input type="hidden" name="mode" id="f_mode">
    <input type="hidden" name="roomCode" id="f_roomCode">
    <input type="hidden" name="nickname" id="f_nickname">
  </form>

  <script>
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzzjmzle-avGL42qkIRQueJOr4yjyNluwxpTWnAaZd_1TJyeUDCqlrW9Luy3QMXvxZzCQ/exec';
    document.getElementById('saveForm').action = GAS_API_URL;

    // 記録の色(カテゴリー分けはやめて、自分で選んだ色で分ける)
    const COLORS = {
      red: '#e74c3c',
      blue: '#219ebc',
      green: '#6cc24a',
      orange: '#ffb703',
      pink: '#ff7eb6'
    };
    // 以前のカテゴリーで保存された記録は、近い色に読み替えて表示する
    const LEGACY_COLOR = { digital_alone: 'orange', offline_alone: 'blue', other: 'green' };
    function normalizeColor(value) {
      if (COLORS[value]) return value;
      return LEGACY_COLOR[value] || 'blue';
    }

    const svg = document.getElementById('clock');
    const clockWrap = document.getElementById('clockWrap');
    const trackGroup = document.getElementById('track');
    const savedArcsGroup = document.getElementById('savedArcs');
    const ticksGroup = document.getElementById('ticks');
    const timeLabel = document.getElementById('timeLabel');
    const recordForm = document.getElementById('recordForm');
    const closeBtn = document.getElementById('closeBtn');

    // ---- 読み込み中は円グラフを隠す ----
    function hideClock() {
      clockWrap.classList.add('loading');
    }
    function showClock() {
      clockWrap.classList.remove('loading');
    }

    // ---- 画面のどこをスクロールしていても気づける、中央に出す警告 ----
    const centerAlertEl = document.getElementById('centerAlert');
    let centerAlertTimer = null;
    function showCenterAlert(message) {
      centerAlertEl.textContent = message;
      centerAlertEl.classList.add('show');
      clearTimeout(centerAlertTimer);
      centerAlertTimer = setTimeout(() => {
        centerAlertEl.classList.remove('show');
      }, 2800);
    }
    centerAlertEl.addEventListener('click', () => {
      centerAlertEl.classList.remove('show');
      clearTimeout(centerAlertTimer);
    });

    // ---- その日の記録一覧(タップすると概要を表示) ----
    function formatDuration(hours) {
      const totalMinutes = Math.round(hours * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      if (h === 0) return `${m}分`;
      if (m === 0) return `${h}時間`;
      return `${h}時間${m}分`;
    }
    function segSweep(seg) {
      let sweep = seg.endHour - seg.startHour;
      if (sweep < 0) sweep += 24;
      return sweep;
    }
    function updateSummary() {
      const list = document.getElementById('dayList');
      list.innerHTML = '';
      const sorted = savedSegments.slice().sort((a, b) => a.startHour - b.startHour);
      let total = 0;
      sorted.forEach((seg) => {
        total += segSweep(seg);
        const row = document.createElement('div');
        row.className = 'day-row';
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = COLORS[seg.color] || '#999';
        const time = document.createElement('span');
        time.className = 'day-time';
        time.textContent = `${formatHour(seg.startHour)}〜${formatHour(seg.endHour)}`;
        const text = document.createElement('span');
        text.className = 'day-text';
        text.textContent = seg.detail || '';
        row.appendChild(dot);
        row.appendChild(time);
        row.appendChild(text);
        row.addEventListener('click', () => openRecordDetail(seg));
        list.appendChild(row);
      });
      if (!sorted.length) list.innerHTML = '<div class="day-empty">まだ記録がありません</div>';
      document.getElementById('dayTotal').textContent = sorted.length ? `記録した時間の合計: ${formatDuration(total)}` : '';
    }

    const CENTER = { x: 150, y: 176 };
    const today = new Date();
    function toDateStr(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    let selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    let dateStr = toDateStr(selectedDate);
    document.getElementById('dateHeading').textContent =
      `${selectedDate.getFullYear()}/${selectedDate.getMonth() + 1}/${selectedDate.getDate()}の記録`;
    const RADIUS = 120;

    function genId() {
      return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    }

    // ---- 24時間の円。一番上が昼の12時、一番下が夜の0時(時計とは並びが違う) ----
    function hourToAngle(hour) {
      return ((hour - 12) / 24) * 2 * Math.PI - Math.PI / 2;
    }

    function polar(hour, radius) {
      const a = hourToAngle(hour);
      return { x: CENTER.x + Math.cos(a) * radius, y: CENTER.y + Math.sin(a) * radius };
    }

    // 開始時刻 sh から sweep 時間ぶんの弧(sweep は 0〜24)
    function describeArc(sh, sweep) {
      if (sweep <= 0) sweep = 0.1;
      const p1 = polar(sh, RADIUS), p2 = polar(sh + sweep, RADIUS);
      const largeArc = sweep > 12 ? 1 : 0;
      return `M ${p1.x} ${p1.y} A ${RADIUS} ${RADIUS} 0 ${largeArc} 1 ${p2.x} ${p2.y}`;
    }

    // 土台の輪: 昼(6〜18時)は明るく、夜(18〜6時)は暗めの色にする
    [[6, '#f6efdc'], [18, '#dfe3ee']].forEach(([from, color]) => {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', describeArc(from, 12));
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', '24');
      trackGroup.appendChild(path);
    });

    // 目盛り(1時間ごと)と、0・6・12・18 の数字だけ表示する
    for (let h = 0; h < 24; h++) {
      const major = h % 6 === 0;
      const inner = polar(h, RADIUS - (major ? 12 : 6));
      const outer = polar(h, RADIUS + (major ? 12 : 6));
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', inner.x); line.setAttribute('y1', inner.y);
      line.setAttribute('x2', outer.x); line.setAttribute('y2', outer.y);
      line.setAttribute('stroke', major ? '#999' : '#c8c8c8');
      line.setAttribute('stroke-width', major ? '2' : '1');
      ticksGroup.appendChild(line);

      if (major) {
        const pos = polar(h, RADIUS - 32);
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', pos.x);
        label.setAttribute('y', pos.y);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('dominant-baseline', 'central');
        label.setAttribute('font-size', '15');
        label.setAttribute('font-weight', 'bold');
        label.setAttribute('fill', '#666');
        label.setAttribute('pointer-events', 'none');
        label.textContent = String(h);
        ticksGroup.appendChild(label);
      }
    }

    // タップされた位置を、実際の時刻(0〜24)に変換する。輪から離れた場所なら null
    function posToHour(clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const scale = 300 / rect.width;
      const x = (clientX - rect.left) * scale - CENTER.x;
      const y = (clientY - rect.top) * scale - CENTER.y;
      if (Math.abs(Math.hypot(x, y) - RADIUS) > 28) return null;
      let angle = Math.atan2(y, x) + Math.PI / 2; // 一番上(=12時)からの時計回りの角度
      if (angle < 0) angle += 2 * Math.PI;
      const hour = 12 + (angle / (2 * Math.PI)) * 24;
      return (Math.round(hour * 4) / 4) % 24;
    }

    function formatHour(h) {
      const hh = Math.floor(h);
      const mm = Math.round((h - hh) * 60);
      return `${hh}:${mm.toString().padStart(2, '0')}`;
    }

    // ---- 記録済みセグメントの管理(重なり判定・タップ編集のため) ----
    let savedSegments = [];

    // 日をまたぐ記録を、0〜24に収まる区間(最大2つ)に分ける
    function segIntervals(s, e) {
      let sweep = e - s;
      if (sweep < 0) sweep += 24;
      if (sweep <= 0) return [];
      const end = s + sweep;
      return end <= 24 ? [[s, end]] : [[s, 24], [0, end - 24]];
    }

    function isHourInSegment(hour, seg) {
      return segIntervals(seg.startHour, seg.endHour).some(([lo, hi]) => hour >= lo && hour < hi);
    }

    function findSegmentAtHour(hour) {
      return savedSegments.find((seg) => isHourInSegment(hour, seg));
    }

    // 他の記録と時間が重なるか。終了と次の開始がぴったり同じ(隣り合う)だけなら重なりではない
    function rangeOverlapsExisting(sh, eh, excludeId) {
      const mine = segIntervals(sh, eh);
      return savedSegments.some((seg) => seg.id !== excludeId &&
        segIntervals(seg.startHour, seg.endHour).some(([a, b]) => mine.some(([c, d]) => a < d && c < b)));
    }

    // 記録済みの時間帯を円に描き直す(日をまたぐ記録も1本の弧でつなげる)
    function renderClockFace() {
      savedArcsGroup.innerHTML = '';
      savedSegments.forEach((seg) => {
        let sweep = seg.endHour - seg.startHour;
        if (sweep < 0) sweep += 24;
        if (sweep <= 0) return;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', describeArc(seg.startHour, sweep));
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', COLORS[seg.color] || '#999');
        path.setAttribute('stroke-width', '24');
        path.setAttribute('stroke-linecap', 'round');
        savedArcsGroup.appendChild(path);
      });
    }

    function addSegment(seg) {
      savedSegments.push(seg);
      updateSummary();
      renderClockFace();
    }

    // ---- 記録済みの部分をタップすると編集画面を開く ----
    svg.addEventListener('pointerdown', (e) => {

      const hit = hour === null ? null : findSegmentAtHour(hour);
      if (hit) {

      } else if (currentEditSegment || currentDetailSegment) {

      }

    let userId = null;
    const DEFAULT_LABEL = '記録をタップすると内容を見られます。新しい記録は「時刻で調整」からどうぞ';

    // ---- 日ごとの記録のキャッシュ(再読み込みを速く感じさせるため) ----
    function cacheKey(uid, ds) {
      return 'otodure_records_' + uid + '_' + ds;
    }
    function loadFromCache(uid, ds) {
      try {
        const raw = localStorage.getItem(cacheKey(uid, ds));

      }
    }
    function saveToCache(uid, records, ds) {
      try {
        localStorage.setItem(cacheKey(uid, ds), JSON.stringify(records));

        // 保存できない環境ではキャッシュを諦めるだけで、通常の読み込みは動く

    // ---- 他の日の記録を見る(カレンダー) ----
    const calendarBtn = document.getElementById('calendarBtn');

    const calGrid = document.getElementById('calGrid');
    const calMonthLabel = document.getElementById('calMonthLabel');

    let calViewMonth = selectedDate.getMonth();

    // ---- 「日付を選ぶ」「時刻で調整」ボタンは、開いている方だけ緑にする ----
    function setActiveToggleBtn(activeId) {
      document.getElementById('timeAdjustBtn').classList.toggle('active', activeId === 'timeAdjustBtn');
      document.getElementById('calendarBtn').classList.toggle('active', activeId === 'calendarBtn');
    }

    function isSameDate(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    function isFutureDate(d) {
      const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return dd.getTime() > t.getTime();
    }

    function renderCalendar() {
      calMonthLabel.textContent = `${calViewYear}年${calViewMonth + 1}月`;
      calGrid.innerHTML = '';
      const firstDay = new Date(calViewYear, calViewMonth, 1);
      const startWeekday = firstDay.getDay();
      const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
      for (let i = 0; i < startWeekday; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day empty';
        calGrid.appendChild(empty);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const cellDate = new Date(calViewYear, calViewMonth, d);
        const cell = document.createElement('div');
        cell.className = 'cal-day';
        cell.textContent = String(d);
        if (isSameDate(cellDate, today)) cell.classList.add('today');
        if (isSameDate(cellDate, selectedDate)) cell.classList.add('selected');
        if (isFutureDate(cellDate)) {
          cell.classList.add('disabled');
        } else {
          cell.addEventListener('click', () => {
            switchToDate(cellDate);
            calendarArea.style.display = 'none';
            setActiveToggleBtn(null);
          });
        }
        calGrid.appendChild(cell);
      }
    }

      renderCalendar();
    });

    // ---- 部屋のメンバー一覧・暫定ランキング ----
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function formatAnnounceDateTime(iso) {
      const d = new Date(iso);
      return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;

    function renderRoomView(data) {

    let roomRequestCounter = 0;
    function loadRoomView() {

      roomRequestCounter += 1;

      const script = document.createElement('script');

      script.onerror = function () {

      };

    document.getElementById('roomTabBtn').addEventListener('click', () => {
      closeRecordForm();
      calendarArea.style.display = 'none';

      document.getElementById('roomView').style.display = 'block';
    });

    document.getElementById('roomViewCloseBtn').addEventListener('click', () => {
      document.getElementById('roomView').style.display = 'none';
    });

    function switchToDate(d) {
      if (!userId) {
        timeLabel.textContent = 'ログイン処理中です。少し待ってからもう一度お試しください';
        return;
      }

      savedArcsGroup.innerHTML = '';

    function loadForSelectedDate() {
      const cached = loadFromCache(userId, dateStr);
      const hasCache = !!(cached && cached.length);
      if (hasCache) {
        cached.forEach((r) => {
          addSegment({
            id: r.id,
            startHour: Number(r.startHour),
            endHour: Number(r.endHour),
            color: normalizeColor(r.category),
            detail: r.detail
          });
        });

        showClock();
      }
      loadTodayRecords(!hasCache);
    }

    // ---- 部屋選択(時計簿 or 合言葉) ----
    const initialLoading = document.getElementById('initialLoading');

    const roomSetupError = document.getElementById('roomSetupError');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const nicknameInput = document.getElementById('nicknameInput');

    function showGate() {
      initialLoading.style.display = 'none';

      roomCodeInput.value = roomCode || '';

    function saveUserSettings(mode, rc, nick) {

      const url = `${GAS_API_URL}?type=user&userId=${encodeURIComponent(userId)}&callback=${cbName}`;
      const script = document.createElement('script');
      script.src = url;
      script.onerror = function () {
        delete window[cbName];
        showGate(); // 設定の取得に失敗した場合は選択からやり直してもらう
      };

    document.getElementById('soloModeBtn').addEventListener('click', () => {

    liff.init({ liffId: '2011303051-VhtUseuB' }).then(() => {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const idToken = liff.getDecodedIDToken && liff.getDecodedIDToken();
      if (idToken && idToken.sub) {
        userId = idToken.sub;
        checkUserSettings();

      }
      return liff.getProfile().then((profile) => {
        userId = profile.userId;
        checkUserSettings();

    }).catch((err) => {
      initialLoading.textContent = 'ログインエラー: ' + err;

    closeBtn.addEventListener('click', () => {

    });

    // ---- 記録の追加・編集フォーム(追加も編集も同じ形) ----
    // 開始・終了のホイールをフォーム内に並べ、その下でカテゴリー・詳細を入力する。
    // キャンセルは左、決定は右。編集のときだけ下に削除ボタンが出る。
    const ITEM_HEIGHT = 36;
    const VISIBLE_COUNT = 3;
    const WHEEL_PAD = ITEM_HEIGHT * Math.floor(VISIBLE_COUNT / 2);
    const HOURS = Array.from({ length: 24 }, (_, i) => i);
    const MINUTES = Array.from({ length: 12 }, (_, i) => i * 5);
    const startHourWheel = document.getElementById('startHourWheel');
    const startMinuteWheel = document.getElementById('startMinuteWheel');
    const endHourWheel = document.getElementById('endHourWheel');
    const endMinuteWheel = document.getElementById('endMinuteWheel');
    const formConfirmBtn = document.getElementById('formConfirmBtn');
    const formDeleteBtn = document.getElementById('formDeleteBtn');
    const formDetail = document.getElementById('formDetail');
    const recordFormTitle = document.getElementById('recordFormTitle');

    function buildWheel(container, values, formatFn) {
      container.innerHTML = '';
      const padTop = document.createElement('div');
      padTop.style.height = WHEEL_PAD + 'px';
      container.appendChild(padTop);
      values.forEach((v) => {
        const item = document.createElement('div');
        item.className = 'wheel-item';
        item.textContent = formatFn(v);
        container.appendChild(item);
      });
      const padBottom = document.createElement('div');
      padBottom.style.height = WHEEL_PAD + 'px';
      container.appendChild(padBottom);
    }

    function getWheelIndex(container, values) {
      const index = Math.round(container.scrollTop / ITEM_HEIGHT);
      return Math.max(0, Math.min(values.length - 1, index));
    }

    function scrollWheelTo(container, values, value) {
      let index = values.indexOf(value);
      if (index === -1) index = 0;
      container.scrollTop = index * ITEM_HEIGHT;
    }

    function highlightCenter(container, values) {
      const index = getWheelIndex(container, values);
      const items = container.querySelectorAll('.wheel-item');
      items.forEach((item, i) => item.classList.toggle('center', i === index));
    }

    [startHourWheel, endHourWheel].forEach((w) => {
      buildWheel(w, HOURS, (v) => String(v));
      w.addEventListener('scroll', () => highlightCenter(w, HOURS));
    });
    [startMinuteWheel, endMinuteWheel].forEach((w) => {
      buildWheel(w, MINUTES, (v) => String(v).padStart(2, '0'));
      w.addEventListener('scroll', () => highlightCenter(w, MINUTES));
    });

    function readWheelValue(hourW, minuteW) {
      return HOURS[getWheelIndex(hourW, HOURS)] + MINUTES[getWheelIndex(minuteW, MINUTES)] / 60;
    }

    // 時刻(例: 13.5)をホイールに反映する。5分単位に丸める
    function setWheelValue(hourW, minuteW, value) {
      const totalMinutes = (Math.round(value * 12) * 5) % 1440;
      scrollWheelTo(hourW, HOURS, Math.floor(totalMinutes / 60));
      scrollWheelTo(minuteW, MINUTES, totalMinutes % 60);
      highlightCenter(hourW, HOURS);
      highlightCenter(minuteW, MINUTES);
    }

    let currentEditSegment = null;
    let currentDetailSegment = null;
    let formSelectedColor = null;
    let lastUsedColor = 'blue';

    function setFormColor(color) {
      formSelectedColor = color;
      document.querySelectorAll('.swatch').forEach((b) => {
        b.classList.toggle('selected', b.dataset.color === color);
      });
      formConfirmBtn.disabled = !color;
    }

    document.querySelectorAll('.swatch').forEach((btn) => {
      btn.addEventListener('click', () => setFormColor(btn.dataset.color));
    });

    // ---- 記録の概要(タップするとまずこれが出る。編集ボタンから編集フォームへ) ----
    const recordDetail = document.getElementById('recordDetail');

    function openRecordDetail(seg) {
      calendarArea.style.display = 'none';
      document.getElementById('roomView').style.display = 'none';
      recordForm.style.display = 'none';
      currentEditSegment = null;
      currentDetailSegment = seg;
      setActiveToggleBtn(null);
      document.getElementById('detailDot').style.background = COLORS[seg.color] || '#999';
      document.getElementById('detailTime').textContent = `${formatHour(seg.startHour)}〜${formatHour(seg.endHour)}`;
      document.getElementById('detailDuration').textContent = `(${formatDuration(segSweep(seg))})`;
      const textEl = document.getElementById('detailText');
      textEl.textContent = seg.detail ? seg.detail : '(内容は入力されていません)';
      textEl.classList.toggle('empty', !seg.detail);
      recordDetail.style.display = 'block';
      recordDetail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('detailEditBtn').addEventListener('click', () => {
      if (currentDetailSegment) openRecordForm(currentDetailSegment);
    });
    document.getElementById('detailCloseBtn').addEventListener('click', () => closeRecordForm());

    // seg が null なら新規追加、記録を渡せば編集
    function openRecordForm(seg) {
      calendarArea.style.display = 'none';
      document.getElementById('roomView').style.display = 'none';
      recordDetail.style.display = 'none';
      currentDetailSegment = null;
      currentEditSegment = seg || null;
      recordFormTitle.textContent = seg ? '記録を編集' : '時刻で調整';
      formDeleteBtn.style.display = seg ? 'block' : 'none';
      formDetail.value = seg ? (seg.detail || '') : '';
      setFormColor(seg ? seg.color : lastUsedColor);
      setActiveToggleBtn(seg ? null : 'timeAdjustBtn');
      // 非表示のままではホイールのスクロール位置を設定できないので、先に表示する
      recordForm.style.display = 'block';

      let startVal, endVal;
      if (seg) {
        startVal = seg.startHour;
        endVal = seg.endHour;
      } else {
        // 新規は「30分前〜今」を初期値にする
        const now = new Date();
        const endMin = Math.floor((now.getHours() * 60 + now.getMinutes()) / 5) * 5;
        endVal = endMin / 60;
        startVal = ((endMin - 30 + 1440) % 1440) / 60;
      }
      setWheelValue(startHourWheel, startMinuteWheel, startVal);
      setWheelValue(endHourWheel, endMinuteWheel, endVal);
      if (seg) recordForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // フォームも概要も閉じる
    function closeRecordForm() {
      recordForm.style.display = 'none';
      recordDetail.style.display = 'none';
      currentEditSegment = null;
      currentDetailSegment = null;
      setActiveToggleBtn(null);
    }

    document.getElementById('timeAdjustBtn').addEventListener('click', () => openRecordForm(null));
    // 編集中にキャンセルしたら、その記録の概要に戻る
    document.getElementById('formCancelBtn').addEventListener('click', () => {
      const seg = currentEditSegment;
      closeRecordForm();
      if (seg) openRecordDetail(seg);
    });

    formConfirmBtn.addEventListener('click', () => {
      if (!formSelectedColor) return;
      const start = readWheelValue(startHourWheel, startMinuteWheel);
      const end = readWheelValue(endHourWheel, endMinuteWheel);
      if (start === end) {
        timeLabel.textContent = '開始と終了の時刻が同じです。時刻を確認してください';
        showCenterAlert('⚠️ 開始と終了の時刻が同じです\n時刻を確認してください');
        return;
      }
      if (rangeOverlapsExisting(start, end, currentEditSegment ? currentEditSegment.id : undefined)) {
        timeLabel.textContent = 'その時間帯はすでに記録があります。空いている時間を選んでください';
        showCenterAlert('⚠️ その時間帯はすでに記録があります\n空いている時間を選んでください');
        return;
      }
      if (!userId) {
        timeLabel.textContent = 'ログイン処理中です。少し待ってからもう一度押してください';
        return;
      }
      const detail = formDetail.value;
      lastUsedColor = formSelectedColor;

      if (currentEditSegment) {
        const seg = currentEditSegment;
        document.getElementById('f_action').value = 'update';
        document.getElementById('f_id').value = seg.id;
        document.getElementById('f_userId').value = userId;
        document.getElementById('f_category').value = formSelectedColor;
        document.getElementById('f_startHour').value = start;
        document.getElementById('f_endHour').value = end;
        document.getElementById('f_detail').value = detail;
        document.getElementById('saveForm').submit();

        seg.color = formSelectedColor;
        seg.detail = detail;
        seg.startHour = start;
        seg.endHour = end;
        updateSummary();
        renderClockFace();
        timeLabel.textContent = '更新しました';
      } else {
        const newId = genId();
        document.getElementById('f_action').value = 'create';
        document.getElementById('f_id').value = newId;
        document.getElementById('f_userId').value = userId;
        document.getElementById('f_category').value = formSelectedColor;
        document.getElementById('f_startHour').value = start;
        document.getElementById('f_endHour').value = end;
        document.getElementById('f_detail').value = detail;
        document.getElementById('f_date').value = dateStr;
        document.getElementById('saveForm').submit();

        // 記録した時間帯を円グラフに固定表示として残す
        addSegment({ id: newId, startHour: start, endHour: end, color: formSelectedColor, detail });
        timeLabel.textContent = '記録しました!続けて記録できます';
      }
      closeRecordForm();
    });

    formDeleteBtn.addEventListener('click', () => {
      if (!currentEditSegment) return;
      const seg = currentEditSegment;
      document.getElementById('f_action').value = 'delete';
      document.getElementById('f_id').value = seg.id;
      document.getElementById('f_userId').value = userId;
      document.getElementById('saveForm').submit();

      savedSegments = savedSegments.filter((x) => x !== seg);
      updateSummary();
      renderClockFace();
      timeLabel.textContent = '削除しました';
      closeRecordForm();
    });

    // ---- 記録の読み込み(表示中の日付ぶん) ----
    // 日付をすばやく切り替えても取り違えないよう、リクエストごとに専用のコールバック名を使う
    let requestCounter = 0;

    function loadTodayRecords(showLoadingText) {
      if (showLoadingText) {
        timeLabel.textContent = '読み込み中...';
        hideClock();
      }
      const requestedDate = dateStr;
      requestCounter += 1;
      const cbName = 'handleTodayRecords_' + requestCounter;
      window[cbName] = function (records) {
        saveToCache(userId, records, requestedDate);
        delete window[cbName];
        if (requestedDate !== dateStr) return; // その間に別の日に切り替えていたら描画しない
        // キャッシュ表示と実際のデータがズレないよう、最新のサーバーデータで描き直す
        savedArcsGroup.innerHTML = '';
        savedSegments = [];
        records.forEach((r) => {
          addSegment({
            id: r.id,
            startHour: Number(r.startHour),
            endHour: Number(r.endHour),
            color: normalizeColor(r.category),
            detail: r.detail
          });
        });
        timeLabel.textContent = DEFAULT_LABEL;
        showClock();
      };
      const url = `${GAS_API_URL}?userId=${encodeURIComponent(userId)}&date=${requestedDate}&callback=${cbName}`;
      const script = document.createElement('script');
      script.src = url;
      script.onerror = function () {
        delete window[cbName];
        if (requestedDate === dateStr) {
          timeLabel.textContent = '記録の読み込みに失敗しました';
          showClock(); // 空でも操作できるように円は表示しておく
        }
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
